name: Website bug
description: Something on deltaaiinnovation.in looks or works wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where you saw the problem
      placeholder: https://deltaaiinnovation.in/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Phone, Tablet, Laptop / desktop]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome on Android
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if you can. Please don't include personal data.
