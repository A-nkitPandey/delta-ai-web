name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type and content check
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
